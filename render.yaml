# ==============================================================================
#  🚀 VTM SAAS — BLUEPRINT OFFICIEL DE DÉPLOIEMENT RENDER (render.yaml)
#  Gestionnaire Commercial SaaS VTM — ViralTech Market
# ==============================================================================
# Ce Blueprint orchestre automatiquement :
# 1. Base PostgreSQL infogérée (Render PostgreSQL)
# 2. Service Backend Web API NestJS (Render Web Service)
# 3. Application Client Commerçant (Render Static Site SPA)
# 4. Console Plateforme Super Admin (Render Static Site SPA)
# 5. Site Vitrine & Conversion Commerciale (Render Static Site SPA)
# ==============================================================================

version: "1"

databases:
  - name: vtm-postgres
    databaseName: gestionnaire_prod
    user: gestionnaire
    region: frankfurt
    plan: starter
    ipAllowList: [] # Autorise les liaisons internes sécurisées au sein du réseau privé Render

services:
  # ----------------------------------------------------------------------------
  # 1. API BACKEND NESTJS (Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: vtm-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build:shared && npx prisma generate --schema packages/db/prisma/schema.prisma && npm run build --workspace apps/api
    preDeployCommand: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: vtm-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: API_CORS_ORIGIN
        value: https://vtm-client.onrender.com,https://vtm-admin.onrender.com,https://vtm-site.onrender.com

  # ----------------------------------------------------------------------------
  # 2. APPLICATION COMMERCIALE CLIENT (Static Site SPA)
  # ----------------------------------------------------------------------------
  - type: web
    name: vtm-client
    runtime: static
    region: frankfurt
    buildCommand: npm ci && npm run build:shared && npm run build --workspace @gestionnaire/client
    staticPublishPath: ./apps/client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://vtm-api.onrender.com

  # ----------------------------------------------------------------------------
  # 3. CONSOLE SUPER ADMIN PLATEFORME (Static Site SPA)
  # ----------------------------------------------------------------------------
  - type: web
    name: vtm-admin
    runtime: static
    region: frankfurt
    buildCommand: npm ci && npm run build:shared && npm run build --workspace @gestionnaire/admin
    staticPublishPath: ./apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://vtm-api.onrender.com

  # ----------------------------------------------------------------------------
  # 4. SITE VITRINE PUBLIC & LANDING (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: vtm-site
    runtime: static
    region: frankfurt
    buildCommand: npm ci && npm run build --workspace @gestionnaire/site
    staticPublishPath: ./apps/site/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_CLIENT_URL
        value: https://vtm-client.onrender.com
      - key: VITE_API_URL
        value: https://vtm-api.onrender.com


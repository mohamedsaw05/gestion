name: gestionnaire

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gestionnaire
      POSTGRES_PASSWORD: gestionnaire_dev_password
      POSTGRES_DB: gestionnaire_dev
    ports:
      - "5442:5432"
    volumes:
      - gestionnaire_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestionnaire -d gestionnaire_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8091:8080"
    depends_on:
      - postgres

volumes:
  gestionnaire_postgres_data:

# Configuration Nginx pour le SaaS VTM — ViralTech Market
# Domaines : app.vtm-market.com (Commerçant), admin.vtm-market.com (Plateforme), api.vtm-market.com (API)

# 1. API NestJS
server {
    listen 80;
    server_name api.vtm-market.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.vtm-market.com;

    ssl_certificate /etc/letsencrypt/live/api.vtm-market.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vtm-market.com/privkey.pem;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# 2. Application Commerçant (Client React SPA)
server {
    listen 80;
    server_name app.vtm-market.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.vtm-market.com;

    ssl_certificate /etc/letsencrypt/live/app.vtm-market.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vtm-market.com/privkey.pem;

    root /var/www/vtm-saas/apps/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache statique agressif pour les assets hashés par Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# 3. Console Super-Admin Plateforme (Admin React SPA)
server {
    listen 80;
    server_name admin.vtm-market.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.vtm-market.com;

    ssl_certificate /etc/letsencrypt/live/admin.vtm-market.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.vtm-market.com/privkey.pem;

    root /var/www/vtm-saas/apps/admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
